[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-asset-ripper-viewer"
version = "0.9.3"
description = "Game asset ripper / viewer — walk game containers, identify assets, convert and export them."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gar contributors" }]
keywords = ["game-asset", "ripper", "viewer", "modding", "reverse-engineering", "pak", "bundle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Disassemblers",
]

dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "numpy>=1.26",
  "pillow>=10.2",
  "zstandard>=0.22",   # UE4/UE5 pak compression
  "lz4>=4.3",          # Unity bundle compression
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "hypothesis>=6.100",
]
native = [
  # Optional C++ accelerated decoders; see src/gar/_native/README
  "pybind11>=2.12",
]

[project.scripts]
gar = "gar.cli:main"
gar-rip = "gar.cli:rip"

[project.entry-points."gar.handlers"]
paks = "gar.handlers.paks_handler:PaksHandler"
bundles = "gar.handlers.bundles_handler:BundlesHandler"

[project.entry-points."gar.processors"]
texture = "gar.processors.textures:TextureProcessor"
mesh = "gar.processors.meshes:MeshProcessor"
audio = "gar.processors.audio:AudioProcessor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: full-container rips, run with -m slow",
  "fixture: needs a downloaded fixture blob",
]